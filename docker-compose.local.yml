# Local Docker hot-reload: bind-mount source + cargo-watch / Vite poll.
# Project: docker compose -f docker-compose.local.yml -p netvan-local up -d
services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    image: netvan-api:local-hot
    restart: unless-stopped
    working_dir: /app
    environment:
      NETVAN_API_BIND: 0.0.0.0:8000
      NETVAN_API_DATA_DIR: /data
      RUST_LOG: info
      CARGO_TARGET_DIR: /app/target
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    volumes:
      - .:/app
      - netvan-api-target:/app/target
      - netvan-api-cargo-registry:/usr/local/cargo/registry
      - netvan-api-cargo-git:/usr/local/cargo/git
      - netvan-api-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8000",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  webui:
    build:
      context: ../netvan-webui
      dockerfile: dockerfile
    image: netvan-webui:local-hot
    restart: unless-stopped
    working_dir: /app
    environment:
      NETVAN_API_PROXY_TARGET: http://api:8000
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: "8001"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_INTERVAL: "400"
    volumes:
      - ../netvan-webui:/app
      - netvan-webui-node-modules:/app/node_modules
    ports:
      - "8001:8001"
    depends_on:
      - api

volumes:
  netvan-api-target:
  netvan-api-cargo-registry:
  netvan-api-cargo-git:
  netvan-api-data:
  netvan-webui-node-modules:
